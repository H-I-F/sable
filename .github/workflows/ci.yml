name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint every importable tree, not just the package
        run: ruff check src tests examples benchmarks

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  test:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]"

      - name: Unit and crash matrix
        run: pytest -q --cov=sable --cov-fail-under=85 tests/

      # The demo scripts are the documentation; if they stop running, the
      # documentation has started lying regardless of what the badges say.
      - name: Walkthrough still runs
        run: python examples/basic.py
      - name: Crash demonstration still recovers everything
        run: python examples/crash_demo.py

  package:
    name: wheel builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: The installed wheel must carry typing markers and the CLI
        run: |
          python -c "import sable, pathlib; assert pathlib.Path(sable.__file__).parent.joinpath('py.typed').exists()"
          sable --help
