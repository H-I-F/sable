# H.I.F PR review report -- deterministic, advisory, zero-cost.
#
# Safety: pull_request_target carries write credentials. This workflow checks
# out ONLY the default branch and never checks out, builds or executes PR code.
# The script reads the PR through the REST API; rules live on the default
# branch, so a contributor cannot rewrite them from a PR.
#
# Triggers:
#   pull_request_target -> first report as the PR arrives
#   workflow_run (CI)   -> refresh once CI finishes, so "Gate status" shows real
#                          conclusions instead of all-pending
#   workflow_dispatch   -> manually re-run for one PR
#
# Phase 1 only suggests: one sticky comment + labels from a fixed allow-list.
name: PR review report

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re)generate the report for"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: >-
    pr-report-${{ github.repository }}-${{
    github.event.pull_request.number ||
    github.event.workflow_run.pull_requests[0].number ||
    inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event_name != 'pull_request_target' ||
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never the PR ref. The script and its rules come from the default branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate / update sticky review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          # Bootstrap guard: on the PR that first introduces this workflow, the
          # default branch does not have the script yet (we never check out the
          # PR ref). Skip cleanly instead of failing the introducing PR.
          if [ ! -f .github/scripts/pr_report.py ]; then
            echo "[=] bootstrap: script not on default branch yet; skipping"
            exit 0
          fi
          python3 -m py_compile .github/scripts/pr_report.py
          python3 .github/scripts/pr_report.py
