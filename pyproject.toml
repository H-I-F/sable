[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sable"
version = "0.1.1"
description = "A crash-safe, pure-Python LSM-tree key-value storage engine reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MKA930" }]
keywords = ["lsm-tree", "key-value", "storage-engine", "wal", "sstable", "crash-safe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
sable = "sable.cli:main"

# The engine itself imports nothing outside the standard library; these exist so
# CI and contributors pin one known-good toolchain rather than drifting.
[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
dev = ["ruff==0.17.3", "mypy==2.4.1", "pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Repository = "https://github.com/MKA930/sable"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sable = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/sable"]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "N", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest suites express expectations through bare asserts by design.
"tests/*" = ["S101"]
"benchmarks/*" = ["S101"]
# Demo scripts assert invariants the same way the suite does.
"examples/*" = ["S101", "S603"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
mypy_path = "src"
